{# Seletor de município: digita o nome (ou "nome/UF") e escolhe na lista; ou GPS. #}
<div class="card" id="picker">
  <div class="muted" style="margin-bottom:8px">Digite o município para levantar os carregadores pagos acima de {{ settings.min_power_kw|num }} kW.</div>
  <div class="muniwrap">
    <input id="picker-q" data-muni="picker-id" placeholder="Município… (ex.: rio verde ou rio verde/go)" autocomplete="off" inputmode="search">
    <input type="hidden" id="picker-id">
  </div>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
    <button class="btn" id="picker-go" type="button" disabled>Selecionar</button>
    <button class="btn ghost" id="picker-gps" type="button">📍 Usar minha localização</button>
  </div>
  <div id="locate-result" class="muted"></div>
</div>
<script src="/static/munisearch.js"></script>
<script>
(function () {
  const q = document.getElementById('picker-q'), hid = document.getElementById('picker-id'),
        go = document.getElementById('picker-go'), gps = document.getElementById('picker-gps'), out = document.getElementById('locate-result');
  async function select(id) {
    go.disabled = true; out.innerHTML = '<span class="spin"></span> pedindo coleta…';
    const r = await fetch('/api/municipio/' + id + '/select', {method: 'POST'});
    if (!r.ok) { out.textContent = 'erro: ' + ((await r.json()).detail || r.status); go.disabled = false; return; }
    location.href = '/?m=' + id;
  }
  q.addEventListener('muniselect', () => { go.disabled = false; });
  q.addEventListener('munichange', () => { go.disabled = !hid.value; });
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && hid.value && !q.nextElementSibling.querySelector('.active')) select(hid.value); });
  go.addEventListener('click', () => { if (hid.value) select(hid.value); });
  gps.addEventListener('click', () => {
    if (!navigator.geolocation) { out.textContent = 'este navegador não tem geolocalização.'; return; }
    if (!window.isSecureContext) { out.textContent = 'o navegador só libera o GPS em HTTPS (ou localhost). Escolha pela lista.'; return; }
    out.innerHTML = '<span class="spin"></span> localizando…';
    navigator.geolocation.getCurrentPosition(async pos => {
      const {latitude: lat, longitude: lon} = pos.coords;
      const r = await fetch(`/api/municipio/locate?lat=${lat}&lon=${lon}`);
      if (!r.ok) { out.textContent = 'não achei um município para sua posição.'; return; }
      const m = await r.json();
      out.innerHTML = `Você está em <b>${m.nome}/${m.uf}</b> · <button class="btn small" type="button" id="gps-go">Selecionar</button>`;
      document.getElementById('gps-go').addEventListener('click', () => select(m.id));
    }, err => { out.textContent = 'GPS negado ou indisponível (' + err.message + ').'; }, {enableHighAccuracy: false, timeout: 15000, maximumAge: 300000});
  });
})();
</script>
